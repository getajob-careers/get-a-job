name: Edge Functions

# Boot-safety net for supabase/functions/. The main CI (ci.yml) typechecks
# only `src/` (tsconfig `include: ["src"]`), so edge functions ship with NO
# static checking — which is how #283 left extract-proof-signals dead for a
# month (a duplicate `const body` = SyntaxError at module load = HTTP 503 on
# every request, invisible to `npm run typecheck`).
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
  workflow_dispatch:

jobs:
  boot-check:
    name: Edge function boot check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Transpile-bundle (SWC, no type-check) every edge function. This
      # mirrors what the Supabase edge runtime does at deploy, so a clean
      # bundle means the function will BOOT — it catches duplicate/invalid
      # declarations, bad imports, and syntax errors (the #283 class).
      #
      # Deliberately NOT `deno check`: the functions tree currently has ~26
      # pre-existing TYPE errors (unknowns, nullability, two duplicate-KEY
      # data bugs) that are runtime-inert (the edge runtime strips types via
      # SWC) and include one in the canonical 00_role_library.ts. Blocking on
      # those would red-fail main today and require editing a source-of-truth
      # library. A blocking `deno check` can be added later, once that type
      # backlog is cleaned up, without weakening this boot gate.
      - name: Bundle-check every edge function
        run: |
          set -uo pipefail
          fail=0
          # --node-modules-dir=none: resolve npm: specifiers (e.g.
          # npm:@supabase/supabase-js) from Deno's own cache. The repo's
          # root package.json otherwise puts Deno in node_modules mode and
          # it fails without an npm install — this keeps the job dependency-
          # free (no npm ci), matching how the edge runtime resolves deps.
          for f in supabase/functions/*/index.ts; do
            if ! deno bundle --no-check --node-modules-dir=none "$f" -o /dev/null 2> /tmp/bundle-err; then
              echo "::error file=$f::Edge function fails to bundle — it will 503 on deploy (module-load / boot error)."
              echo "----- $f -----"
              cat /tmp/bundle-err
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more edge functions fail to bundle and would 503 in production. Fix before merge."
            exit 1
          fi
          echo "All edge functions bundle cleanly — no boot errors."
