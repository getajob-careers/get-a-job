# Nightly job-cache refresh + extraction (two-stage).
#
# Stage 1 — Ingest (scripts/refresh-jobs.ts):
#   Iterates the 831-company registry at
#   supabase/functions/_shared/libraries/companies_il.json, filters down to
#   the ~440 entries with a supported ATS (Greenhouse / Lever / Ashby /
#   Workday / SmartRecruiters / Comeet / SuccessFactors / Workable),
#   fetches their public listings, and UPSERTs Israeli jobs into
#   public.jobs. Ingestion writes nothing about LLM-extracted fields
#   (function_family, req_skills_*, req_seniority, etc.) — those land
#   blank on every newly-ingested row.
#
# Stage 2 — Extract (scripts/backfill-job-requirements.ts):
#   Walks any active row with `extracted_at IS NULL` (or below the
#   current schema version) and invokes the extract-job-requirements
#   edge function, populating the LLM-derived fields the Jobs page and
#   Tracker depend on. Idempotent (description_hash + schema_version
#   skip), continue-on-error (extraction failures must not break
#   ingestion), capped at --limit=500 as a runaway-cost safety net.
#   Closes the extraction loop that used to grow ~30-60 rows/night of
#   silent backlog when extraction was manual-only (2026-06-03 audit).
#
# Stage 3 — Derive Hebrew seniority (scripts/derive-hebrew-seniority.ts):
#   The title-regex classifier in normalize.ts is English-only, so
#   Hebrew titles fall through to seniority='mid'. After extraction
#   populates the LLM's req_seniority (Hebrew-aware), this stage maps
#   it back to the lowercase seniority column the Jobs filter + card
#   badge read from — but only on Hebrew rows where the regex landed
#   the default 'mid'. Never overrides a regex-asserted entry/senior/
#   lead/director. Idempotent; safe to re-run.
#
# Schedule: 01:00 UTC daily = 03:00 IL (winter) / 04:00 IL (summer).
# Off-peak both ways; exact local time isn't load-bearing (no users
# watching the run).
#
# Job-level timeout: 18 min. Ingest typically 3-5 min, extraction
# capped at 8 min for the per-night delta of ~30-60 rows. The job
# ceiling has a few minutes of headroom for catch-up runs after a
# missed cron.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   - SUPABASE_URL                = https://ilmqmodklutztuybsvwd.supabase.co
#   - SUPABASE_SERVICE_ROLE_KEY   = the project's service-role key
#                                   (bypasses RLS — write access only here,
#                                   also authorizes edge-function invocation
#                                   in stage 2)
#
# Manually trigger:
#   gh workflow run refresh-jobs.yml
#   OR via the Actions tab → "Refresh jobs cache" → "Run workflow"

name: Refresh jobs cache

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Cancel an in-flight run if a new one starts. Avoids overlapping runs
  # (which would race UPSERTs harmlessly but could double the API load).
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Raised 18 -> 25 (2026-07-27 supply-growth P1, PR #833). The Refresh step
    # has no per-step budget, so this job ceiling bounds it. On a contention
    # night the timing-out UPSERTs each sit for the full 120s statement_timeout,
    # so the step already reached 10m17s on 2026-07-27; the paired upsert-retry
    # (up to two backoff waits per timing-out company) plus concurrency 20->16
    # lengthen it further. 25 gives headroom so the job is not killed mid-write.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh jobs cache
        run: npx tsx scripts/refresh-jobs.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Stage 2: extract LLM-derived fields for any newly-ingested rows.
      # `if: always()` — extraction and fetch-health are INDEPENDENT
      #   concerns. Stage 1 exits 1 as a fetch-health ALARM (per-ATS or
      #   global failure budget); that must not skip extraction, which
      #   operates on whatever DID ingest. Coupling them (the old
      #   `if: success()`) caused the 2026-06-13 regression: a single
      #   broken ATS family (iai) tripped Stage 1's exit 1 and silently
      #   skipped extraction for EVERY newly-ingested job, every night.
      #   Matches Stage 3, which is already `if: always()`.
      # `continue-on-error: true` — extraction failures must never break
      #   the run; if the edge function or OpenAI is down, the run stays
      #   green and tomorrow's run picks up the still-null rows.
      # `--limit=500` — runaway-cost safety net (~$2.50 worst case).
      - name: Backfill extraction for newly-ingested jobs
        if: always()
        continue-on-error: true
        # Raised 8 -> 14 (2026-07-27 EY SF recovery): the #833 upsert retry
        # (NVIDIA/PANW, ~412 rows) plus the EY SF board coming back online add a
        # burst of newly-ingested rows to extract; 8 min was too tight for the
        # backlog. Job cap (25) still bounds the whole job.
        timeout-minutes: 14
        run: >
          npx tsx scripts/backfill-job-requirements.ts
          --concurrency=8
          --progress-every=50
          --limit=500
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Stage 3: derive jobs.seniority from req_seniority on Hebrew
      # rows the title-regex defaulted to 'mid'. Runs even if stage 2
      # timed out — operates on whatever req_seniority values landed.
      # Idempotent; the predicate skips already-flipped rows.
      - name: Derive Hebrew seniority from req_seniority
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: npx tsx scripts/derive-hebrew-seniority.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
