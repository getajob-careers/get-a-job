name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual dispatch — useful when investigating why automatic triggers
  # didn't fire (post-transfer to getajob-careers/get-a-job May 12).
  workflow_dispatch:

jobs:
  test:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The client-side mirrors are generated from the canonical TS libraries
      # and must be regenerated when those change, or they silently drift:
      #   - roleLookup.js + roleSkillsGenerated.json  <- 00_role_library.ts
      #     (drifted for weeks, roleLookup 159 vs 195, after the generator was lost)
      #   - skillIdsGenerated.json                    <- 01_skill_library.ts
      #     (drifted 599 vs 618 after the 7-role expansion #580-582)
      # Regenerate and fail if the committed mirrors differ. Generators use only
      # node built-ins, so this runs before npm ci for a fast fail.
      - name: Generated-mirror staleness check
        run: |
          node scripts/regen-role-skills.mjs
          node scripts/regen-role-lookup.mjs
          node scripts/regen-skill-ids.mjs
          if ! git diff --exit-code -- src/lib/roleSkillsGenerated.json src/lib/roleLookup.js src/lib/skillIdsGenerated.json; then
            echo "::error::Generated mirrors are stale vs the canonical libraries — run 'node scripts/regen-role-skills.mjs && node scripts/regen-role-lookup.mjs && node scripts/regen-skill-ids.mjs' and commit."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: false

      # Typecheck is non-blocking until the existing TS errors in Tracker.jsx
      # (shadcn component type inference issues) are resolved. Track progress
      # via `npm run typecheck` locally; this step surfaces regressions
      # without red-failing every PR. Flip to continue-on-error: false once
      # the baseline errors are zero.
      - name: Typecheck (non-blocking)
        run: npm run typecheck
        continue-on-error: true

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # Vite build does not need real values for VITE_* at build time
          # (they're read at runtime), but the supabase client throws if absent.
          # CI uses placeholder values; production deploys inject real ones.
          VITE_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
