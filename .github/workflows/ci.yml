name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual dispatch — useful when investigating why automatic triggers
  # didn't fire (post-transfer to getajob-careers/get-a-job May 12).
  workflow_dispatch:

jobs:
  test:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The client-side role mirrors (src/lib/roleLookup.js and
      # roleSkillsGenerated.json) are generated from 00_role_library.ts and
      # must be regenerated when it changes. They silently drifted for weeks
      # (roleLookup 159 vs 195 canonical) after the original generator was
      # lost. Regenerate and fail if the committed mirrors differ. Generators
      # use only node built-ins, so this runs before npm ci for a fast fail.
      - name: Role-mirror staleness check
        run: |
          node scripts/regen-role-skills.mjs
          node scripts/regen-role-lookup.mjs
          if ! git diff --exit-code -- src/lib/roleSkillsGenerated.json src/lib/roleLookup.js; then
            echo "::error::Role mirrors are stale vs 00_role_library.ts — run 'node scripts/regen-role-skills.mjs && node scripts/regen-role-lookup.mjs' and commit."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: false

      # Ground-occlusion guard: fails if a ground-filling layout wrapper carries
      # an opaque bg that would occlude the -z-10 grain ground. This bug class
      # recurred three times invisibly; enforce it so it cannot recur silently.
      - name: Ground check
        run: npm run check:ground
        continue-on-error: false

      # Typecheck is non-blocking until the existing TS errors in Tracker.jsx
      # (shadcn component type inference issues) are resolved. Track progress
      # via `npm run typecheck` locally; this step surfaces regressions
      # without red-failing every PR. Flip to continue-on-error: false once
      # the baseline errors are zero.
      - name: Typecheck (non-blocking)
        run: npm run typecheck
        continue-on-error: true

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # Vite build does not need real values for VITE_* at build time
          # (they're read at runtime), but the supabase client throws if absent.
          # CI uses placeholder values; production deploys inject real ones.
          VITE_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
