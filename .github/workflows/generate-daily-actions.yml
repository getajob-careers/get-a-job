# Daily-action precompute — SCHEDULE DISABLED, manual-only (Arc 0 PR#2).
#
# The nightly cron was turned OFF 2026-07-06: the daily-action surface had
# 0 completions across 50 users while the cron wrote 723 pending rows and
# burned LLM spend every night (deep-qa-3 2026-07-05) — pure paid noise.
# The on-demand invoke on Home was removed in the same PR; the Home hero now
# degrades to an honest next-action pointer. A redesigned "resume where you
# left off" hero is queued (docs/design/ia-interaction-spec.md §3.4.4).
#
# Kept as workflow_dispatch-only (script + edge fns untouched) so the whole
# thing can be revived if that redesign gives the surface a reason to exist.
#
# Runs scripts/generate-daily-actions.ts → cron-generate-daily-action per
# onboarding-complete user (idempotent per (user_id, for_date)).
#
# Required repo secrets (same as refresh-jobs.yml):
#   - SUPABASE_URL                = https://ilmqmodklutztuybsvwd.supabase.co
#   - SUPABASE_SERVICE_ROLE_KEY   = the project's service-role key
#
# Manually trigger:
#   gh workflow run generate-daily-actions.yml

name: Generate daily actions

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    name: Generate daily actions for all active users
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily-action precompute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/generate-daily-actions.ts
