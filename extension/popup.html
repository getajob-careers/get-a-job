<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Rokkitt (display serif) from Google Fonts, matching www.getajob.careers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Design tokens — mirror the live app's redesign palette (src/index.css) ── */
      :root {
        --gaj-page: #fbf7f1; /* warm cream page surface */
        --gaj-panel: #efe7db; /* panel / assistant-bubble surface */
        --gaj-card: #ffffff; /* card surface */
        --gaj-soft: #f3ece0; /* soft chip surface */
        --gaj-coral: #ef5a41; /* sole CTA accent */
        --gaj-coral-dark: #c7461f; /* hover */
        --gaj-coral-tint: #fce6df; /* tinted accent surface */
        --gaj-ink: #211d18; /* primary text */
        --gaj-muted: #857f74; /* muted text */
        --gaj-border: #e4dbcb; /* soft warm border */
        --gaj-border-subtle: #ede7dd;
        --gaj-radius: 15px;
        --gaj-serif: "Rokkitt", Georgia, serif;
        --gaj-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font: 13px var(--gaj-sans);
        width: 390px;
        margin: 0;
        padding: 0;
        color: var(--gaj-ink);
        background: var(--gaj-page);
      }

      /* ── Pills ── */
      .pills {
        display: flex;
        gap: 8px;
        padding: 12px 12px 10px;
        position: sticky;
        top: 0;
        background: var(--gaj-page);
        border-bottom: 1px solid var(--gaj-border-subtle);
        z-index: 2;
      }
      .pill {
        flex: 0 0 auto;
        padding: 6px 18px;
        border-radius: 999px;
        font-family: var(--gaj-serif);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--gaj-border);
        background: var(--gaj-panel);
        color: var(--gaj-muted);
        user-select: none;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      .pill.active {
        background: var(--gaj-coral);
        color: #fff;
        border-color: var(--gaj-coral);
      }
      #sessionLine {
        padding: 6px 12px;
        font-size: 11px;
        color: var(--gaj-muted);
        white-space: pre-wrap;
      }
      .view {
        padding: 10px 12px 14px;
      }
      .hidden {
        display: none;
      }

      /* ── Agent / chat ── */
      #messages {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 360px;
        overflow-y: auto;
        padding-bottom: 4px;
      }
      .msg {
        padding: 9px 12px;
        border-radius: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        font-size: 13px;
      }
      .msg.user {
        background: var(--gaj-coral);
        color: #fff;
        align-self: flex-end;
        max-width: 85%;
        border-bottom-right-radius: 5px;
      }
      .msg.assistant {
        background: var(--gaj-panel);
        color: var(--gaj-ink);
        align-self: flex-start;
        max-width: 90%;
        border-bottom-left-radius: 5px;
      }
      /* Typing indicator — pulsing coral dot + staged loading text */
      .msg.typing {
        background: var(--gaj-panel);
        color: var(--gaj-muted);
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .msg.typing::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gaj-coral);
        flex: 0 0 auto;
        animation: gaj-pulse 1.1s ease-in-out infinite;
      }
      @keyframes gaj-pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      /* ── Action cards (add-to-tracker, generate-CV, fit, CV result) ── */
      .card {
        border: 1px solid var(--gaj-border);
        background: var(--gaj-card);
        border-radius: var(--gaj-radius);
        padding: 12px;
        align-self: flex-start;
        max-width: 92%;
        box-shadow: 0 1px 2px rgba(33, 29, 24, 0.05);
      }
      .card.cv {
        border-color: var(--gaj-coral);
        background: linear-gradient(0deg, var(--gaj-coral-tint) 0%, #fff 60%);
      }
      .card h4 {
        margin: 0 0 5px;
        font-family: var(--gaj-serif);
        font-weight: 600;
        font-size: 15px;
        color: var(--gaj-ink);
      }
      .card .meta {
        color: var(--gaj-muted);
        font-size: 12px;
        margin-bottom: 9px;
      }
      .card button,
      .card a.cvlink {
        display: inline-block;
        padding: 7px 14px;
        border-radius: 10px;
        border: none;
        background: var(--gaj-coral);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.12s ease;
      }
      .card button:hover:not(:disabled),
      .card a.cvlink:hover {
        background: var(--gaj-coral-dark);
      }
      .card button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .card .note {
        color: var(--gaj-muted);
        font-size: 11.5px;
        margin-top: 7px;
      }

      /* ── Composer ── */
      .composer {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }
      #input {
        width: 100%;
        min-height: 62px;
        max-height: 150px;
        resize: vertical;
        padding: 9px 11px;
        border: 1px solid var(--gaj-border);
        border-radius: 12px;
        background: var(--gaj-card);
        color: var(--gaj-ink);
        font: 13px var(--gaj-sans);
        line-height: 1.45;
      }
      #input::placeholder {
        color: var(--gaj-muted);
      }
      #input:focus {
        outline: none;
        border-color: var(--gaj-coral);
        box-shadow: 0 0 0 3px var(--gaj-coral-tint);
      }
      .composer-buttons {
        display: flex;
        gap: 8px;
      }
      .btn-primary {
        flex: 1;
        padding: 10px 14px;
        border-radius: 11px;
        border: none;
        background: var(--gaj-coral);
        color: #fff;
        font-family: var(--gaj-serif);
        font-size: 14.5px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--gaj-coral-dark);
      }
      .btn-secondary {
        flex: 0 0 auto;
        padding: 10px 18px;
        border-radius: 11px;
        border: 1px solid var(--gaj-border);
        background: var(--gaj-panel);
        color: var(--gaj-ink);
        font-family: var(--gaj-serif);
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-secondary:hover:not(:disabled) {
        border-color: var(--gaj-border-hover, #e0d6c4);
      }
      .btn-primary:disabled,
      .btn-secondary:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* ── Tracker cards ── */
      .trk-row {
        border: 1px solid var(--gaj-border);
        background: var(--gaj-card);
        border-radius: var(--gaj-radius);
        padding: 11px 13px;
        margin-bottom: 8px;
        box-shadow: 0 1px 2px rgba(33, 29, 24, 0.05);
        transition: border-color 0.12s ease;
      }
      .trk-row:hover {
        border-color: #e0d6c4;
      }
      .trk-role {
        font-family: var(--gaj-serif);
        font-size: 15px;
        font-weight: 600;
        color: var(--gaj-ink);
        line-height: 1.25;
      }
      .trk-company {
        color: var(--gaj-muted);
        font-size: 12px;
        margin-top: 1px;
      }
      .trk-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .status-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--gaj-soft);
        color: var(--gaj-muted);
        text-transform: capitalize;
        letter-spacing: 0.01em;
      }
      .match-chip {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--gaj-coral-tint);
        color: var(--gaj-coral-dark);
      }
      .trk-date {
        margin-left: auto;
        color: var(--gaj-muted);
        font-size: 11px;
      }

      /* ── Empty / loading states ── */
      .empty {
        color: var(--gaj-muted);
        text-align: center;
        padding: 22px 12px;
        font-size: 12.5px;
      }
      .empty .empty-title {
        font-family: var(--gaj-serif);
        font-size: 15px;
        color: var(--gaj-ink);
        margin-bottom: 3px;
      }
    </style>
  </head>
  <body>
    <div class="pills">
      <div class="pill active" id="pillAgent" data-view="agent">Agent</div>
      <div class="pill" id="pillTracker" data-view="tracker">Tracker</div>
    </div>
    <div id="sessionLine">Loading session…</div>

    <div class="view" id="agentView">
      <div id="messages"></div>
      <div class="composer">
        <textarea
          id="input"
          placeholder="Paste a JD or talk to your coach…"
        ></textarea>
        <div class="composer-buttons">
          <button id="generateCv" class="btn-primary">
            Generate CV for this role
          </button>
          <button id="send" class="btn-secondary">Send</button>
        </div>
      </div>
    </div>

    <div class="view hidden" id="trackerView">
      <div id="trackerList"><div class="empty">Loading…</div></div>
    </div>

    <!-- load order: config (public url+anon) → bundled supabase-js → popup logic -->
    <script src="config.js"></script>
    <script src="vendor/supabase.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
