<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF8F1" />
    <!-- NEXT_DESIGN flag bootstrap. Resolves the redesign flag ONCE, before first
         paint and before the CSS module loads, so the token overrides in
         :root[data-next-design] (src/index.css) and the JS guard
         (src/lib/nextDesign.js) never disagree and there is no flash. Precedence:
         ?next= query param > localStorage 'nextDesign' > VITE_NEXT_DESIGN build
         default. Flag OFF (default) = current production, untouched. This whole
         block is deleted at reveal. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("next");
          if (q === "1") localStorage.setItem("nextDesign", "1");
          else if (q === "0") localStorage.removeItem("nextDesign");
          var envDefault = "%VITE_NEXT_DESIGN%" === "1";
          if (localStorage.getItem("nextDesign") === "1" || envDefault) {
            document.documentElement.setAttribute("data-next-design", "");
          }
        } catch (e) {}
      })();
    </script>
    <!-- SEO / social. Static so no-JS crawlers and social unfurlers (which do
         NOT run JS) get a real card. Per-route overrides (canonical, JSON-LD)
         are set at runtime in the landing head hook. -->
    <meta
      name="description"
      content="A career operating system for students entering tech — AI agents for your roadmap, tailored CVs, LinkedIn, and interview prep in one connected workspace."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.getajob.careers/" />
    <meta
      property="og:title"
      content="Get A Job: Your job search, finally connected"
    />
    <meta
      property="og:description"
      content="A career operating system for students entering tech — AI agents for your roadmap, tailored CVs, LinkedIn, and interview prep in one connected workspace."
    />
    <meta
      property="og:image"
      content="https://www.getajob.careers/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Get A Job — everything you need to get a job, in one place."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Get A Job: Your job search, finally connected"
    />
    <meta
      name="twitter:description"
      content="A career operating system for students entering tech — AI agents for your roadmap, tailored CVs, LinkedIn, and interview prep in one connected workspace."
    />
    <meta
      name="twitter:image"
      content="https://www.getajob.careers/og-image.png"
    />
    <!-- Redesign display font — Rokkitt slab serif. Used via Tailwind
         font-display utility or var(--rd-font-display). Body keeps the
         platform default system stack. See tasks/redesign.md.

         Archivo is the LOGOTYPE face only (the "Get"/"Job" words of the
         locked lockup — see docs/design/canvas-tokens.md). It is NOT a
         general display face: nothing else may set Archivo. Weight 700
         only, to keep the added payload to one weight. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@500;600;700;800&display=swap"
    />
    <!-- Archivo is the LOGOTYPE face only (the wordmark), weight 700 -
         see docs/design/canvas-tokens.md. Loaded app-wide in Phase 0 so the
         production logotype matches the canvas. Nothing else may set Archivo. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&display=swap"
    />
    <title>Get A Job: Your job search, finally connected</title>
  </head>
  <body>
    <div id="root">
      <!-- Boot loader (QA-R1 P1): covers the pre-React blank on first paint,
           before the JS bundle mounts, on every route. React clears #root's
           contents on mount, so this is removed automatically. App-level auth
           spinner + per-route skeletons (e.g. HomeSkeleton) take over from here. -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #faf7f2;
        "
      >
        <div
          style="
            width: 32px;
            height: 32px;
            border: 4px solid #e5e0d8;
            border-top-color: #2c3e50;
            border-radius: 9999px;
            animation: gaj-boot-spin 0.8s linear infinite;
          "
        ></div>
      </div>
      <style>
        @keyframes gaj-boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
