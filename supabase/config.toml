# Gateway JWT verification is pinned PER FUNCTION so a plain
# `supabase functions deploy <slug>` can never silently flip a function's
# verify_jwt. Unpinned functions ride the Supabase CLI default (true), which is
# how a routine redeploy of extract-jd-basics flipped it false->true on
# 2026-07-19. Every deployed function is now pinned at its deliberate live value
# to end that drift class. When adding a new function, add its
# [functions.<slug>] pin here at the value you intend, so its gate config is
# deterministic from the first deploy.
#
# verify_jwt = false: the function authenticates internally via
# supabase.auth.getUser() on the passed Authorization header (gateway-open +
# internal gate). Historically false was also a WORKAROUND because the gateway's
# HS256 verifier could not validate this project's asymmetric ES256 signing
# keys. That is no longer true: verified 2026-07-19 that an ES256 user token
# passes a verify_jwt=true gateway (HTTP 200). So the false pins below are now a
# deliberate design choice, not a technical necessity.
#
# verify_jwt = true: the gateway enforces auth before the request reaches the
# function. Functions that ALSO run an internal getUser() gate get defense in
# depth (redundant but harmless).

# ============================================================================
# verify_jwt = false  (gateway-open + internal getUser() gate)
# ============================================================================
[functions.generate-career-analysis]
verify_jwt = false

[functions.generate-tailored-cv]
verify_jwt = false

[functions.refine-cv]
verify_jwt = false

[functions.generate-tasks]
verify_jwt = false

# Not currently deployed to this project; pin retained so a future (re)deploy
# lands at false rather than the CLI default.
[functions.generate-job-suggestions]
verify_jwt = false

[functions.extract-proof-signals]
verify_jwt = false

[functions.extract-job-requirements]
verify_jwt = false

[functions.generate-learning-paths]
verify_jwt = false

[functions.ai-chat]
verify_jwt = false

[functions.analyze-job-match]
verify_jwt = false

[functions.lookup-role-skills]
verify_jwt = false

# ============================================================================
# verify_jwt = true  (gateway enforces auth)
# ============================================================================
[functions.extract-jd-basics]
verify_jwt = true

[functions.extract-story-from-text]
verify_jwt = true

[functions.extract-cv-text]
